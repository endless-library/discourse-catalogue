data_url:
  default: "https://script.google.com/macros/s/AKfycbwc6_ayfxFmXXZoaJRV1GGTdxfsOI5MHnmx6KyoQOjHYHD1GPMZdWRqygBB72YaSS67/exec?page=catalogue-data"
  description: "The Apps Script web app URL that returns the catalogue as JSON (ends in ?page=catalogue-data)."

category_slug:
  default: "catalogue"
  description: "Slug of the Discourse category whose page shows the catalogue instead of a topic list."

show_header_links:
  default: true
  description: "Show the catalogue links in the site header (Browse books / Browse collections beside the logo; one link in the phones' second row). While they are shown, the page's own Books / Collections tabs only appear on phones."

books_label:
  default: "Browse books"
  description: "Label for the books header link and tab."

collections_label:
  default: "Browse collections"
  description: "Label for the collections header link and tab."

mobile_label:
  default: "Catalogue"
  description: "Label of the single catalogue link in the phones' second header row (and on narrow screens beside the logo). It opens the catalogue with its books / collections tabs."

show_menu_link:
  default: true
  description: "Also add a 'Library catalogue' link to the Community section of the menu (handy on phones)."

refresh_after_minutes:
  type: integer
  default: 5
  min: 0
  description: "Visitors see their last downloaded copy instantly; a fresh copy is fetched in the background once it is older than this many minutes."

svg_icons:
  type: list
  list_type: compact
  default: "book|id-card|screwdriver-wrench|up-right-from-square|book-open-reader"
  description: "Icons this component uses, so Discourse includes them in the icon set."

# ── Membership link ──────────────────────────────────────────────────────────
show_membership_link:
  default: true
  description: "Show a membership link in the header (on phones too) and in the menu. It reads 'New membership' for people who aren't members and 'My membership' for people who are."

membership_group:
  default: "members"
  description: "Name of the Discourse group the subscriptions plugin adds paying members to. Being in this group is what switches the link to 'My membership'. The group's visibility must let its own members see it (anything except 'group owners and staff')."

new_membership_label:
  default: "New membership"
  description: "Link text for people without a membership."

my_membership_label:
  default: "My membership"
  description: "Link text for people with a membership."

new_membership_url:
  default: "/s"
  description: "Where 'New membership' goes: /s for the subscriptions plugin's product page, or /s/subscriptions if the pricing table is turned on."

# ── Library Manager (librarians) and My loans (everyone signed in) ─────────
librarian_category_slug:
  default: "library-manager"
  description: "Slug of the librarians-only category whose page shows the Library Manager (Lend · Loans · Members) instead of a topic list. Leave blank to turn this off. Who can open it is set by the category's Security settings; the library server also checks the visitor is in the Librarians group."

my_loans_category_slug:
  default: "my-loans"
  description: "Slug of the category whose page shows the visitor's own loans (with Renew). Leave blank to turn this off."

manager_api_url:
  default: ""
  description: "Library server address for these pages: the /exec URL of the Apps Script deployment set to 'Execute as: Me, Who has access: Anyone'. Leave blank to use the same deployment as data_url (the catalogue)."

librarian_app_url:
  default: "https://script.google.com/macros/s/AKfycbykZprOi_Fo5nAPckXGKfNUc-ejGEGpTnRKn2cNo3YPzSJ4SS2G3IhzW90gI-A6LY1n/exec"
  description: "The full Library Manager Google app (ends in /exec), linked from the Library Manager page for things that page doesn't do (Access, collection owners' tools)."

show_librarian_menu_link:
  default: true
  description: "Add a 'Library Manager' link to the menu for people who can see the librarians category."

show_my_loans_link:
  default: true
  description: "Add a 'My loans' link to the menu for logged-in people."

# ── Media link ───────────────────────────────────────────────────────────────
show_media_link:
  default: true
  description: "Add a Media link to the header group (after Membership beside the logo; in the phones' second row). Turn off the Media gallery component's own 'show header link' setting so it isn't shown twice."

media_label:
  default: "Media"
  description: "Label for the Media link."

media_category_slug:
  default: "archive"
  description: "Slug of the media gallery's category."
